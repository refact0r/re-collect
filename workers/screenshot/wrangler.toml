name = "screenshot-worker"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[browser]
binding = "BROWSER"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "re-collect"

# API_KEY is a secret, not a var: wrangler secret put API_KEY

# The dev deployment's own worker, writing to the dev bucket (deploy:screenshot-dev).
# Bindings aren't inherited, so it repeats them; its API_KEY is set with --env dev.
[env.dev]
name = "screenshot-worker-dev"

[env.dev.browser]
binding = "BROWSER"

[[env.dev.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "re-collect-dev"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
