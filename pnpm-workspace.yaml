packages:
  - "workers/screenshot"

onlyBuiltDependencies:
  - esbuild
  - sharp

# Fetch sharp's native binaries for the Convex Node runtime (linux-arm64/x64)
# alongside the local dev platform. Without these, `convex push` fails to load
# the bundled `sharp` module.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc
